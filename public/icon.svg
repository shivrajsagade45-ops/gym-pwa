    <rect x="80" y="80" width="160" height="160" rx="16"/>
    <line x1="80" y1="160" x2="20" y2="160"/>
    <line x1="240" y1="160" x2="300" y2="160"/>
    <rect x="0" y="120" width="20" height="80" rx="8" fill="white"/>
